{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
  <div class="card shadow-sm"><div class="card-body">
    <h1 class="h4 mb-3">{{ heading }}</h1>
    <form method="post">
      {% include "accounts/_form.html" %}
      <datalist id="{{ datalist_id }}">
        {% for place in wishlist %}<option value="{{ place }}"></option>{% endfor %}
      </datalist>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-primary" type="submit">{{ submit_label }}</button>
        <a class="btn btn-outline-secondary" href="{% if trip %}{% url 'trip_detail' trip.pk %}{% else %}{% url 'dashboard' %}{% endif %}">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
