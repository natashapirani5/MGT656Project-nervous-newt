<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team ancient-water</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
  <h1 class="h3">Team ancient-water</h1>
  <ul>
    {% for nickname in team_members %}<li>{{ nickname }}</li>{% endfor %}
  </ul>
  <form method="post" action="{% url 'ab_click' %}">
    {% csrf_token %}
    <button id="abtest" type="submit" class="btn btn-primary btn-lg">{{ variant }}</button>
  </form>
</main>
</body>
</html>
